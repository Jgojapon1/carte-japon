<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<!-- ✅ viewport amélioré pour mobile -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/leaflet.css">
<link rel="stylesheet" href="css/qgis2web.css">
<link rel="stylesheet" href="css/fontawesome-all.min.css">
<link rel="stylesheet" href="css/leaflet.photon.css">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

<style>
html, body {
    width: 100%;
    height: 100%;
    padding: 0;
    margin: 0;
    background-color: #0b0b0c;
    overflow-x: hidden; /* ✅ FIX débordement */
    overflow-y: auto;
}

#map-container {
    width: 100%;
    height: 600px;
    position: relative;
    background-color: transparent !important;
}

#map-main {
    width: 100%;
    height: 100%;
    float: left;
    background-color: transparent !important;
}

#map-okinawa {
    width: 10%;
    height: 17%;
    position: absolute;
    right: 25%;
    top: 78%;
    border: 1px solid #fff;
    background-color: #0b0b0c !important;
    z-index: 1000;
}

.leaflet-label {
    background-color: rgba(255, 255, 255, 0.85);
    padding: 2px 4px;
    border-radius: 3px;
    border: 1px solid #ccc;
    pointer-events: none;
}

.leaflet-control-attribution {
    right: 30px !important;
}

#hover-label {
    position: fixed;
    top: 36%;
    left: 5%; /* ✅ positionné à gauche proprement */
    transform: translateY(-50%);
    background: #0b0b0c;
    color: #F2C320;
    padding: 12px 16px;
    border-radius: 6px;
    font-family: 'Playfair Display', serif;
    font-size: 35px;
    pointer-events: none;
    z-index: 9999;
    width: 240px;
    text-align: center;
}

/* ✅ MOBILE OPTIMISATION */
@media (max-width: 768px) {

    #map-container {
        height: 500px;
        width: 100%;
    }

    #map-okinawa {
        width: 25%;
        height: 20%;
        right: 5%;
        top: 75%;
    }

    #hover-label {
        font-family: 'Playfair Display', serif;
        font-size: 22px;
        width: auto;
        max-width: 60%;
        left: 5%;
        top: 20%;
        transform: translateY(-50%);
        padding: 8px 12px;
        background-color: #0b0b0c;
        color: #E0B86C;
    }
}
</style>

<title>Carte du Japon avec Okinawa</title>
</head>

<body>

<div id="map-container">
    <div id="map-main"></div>
    <div id="map-okinawa"></div>
    <div id="hover-label">Découvrir</div>
</div>

<script src="js/qgis2web_expressions.js"></script>
<script src="js/leaflet.js"></script>
<script src="js/leaflet.rotatedMarker.js"></script>
<script src="js/leaflet.pattern.js"></script>
<script src="js/leaflet-hash.js"></script>
<script src="js/Autolinker.min.js"></script>
<script src="js/rbush.min.js"></script>
<script src="js/labelgun.min.js"></script>
<script src="js/labels.js"></script>
<script src="js/leaflet.photon.js"></script>
<script src="data/j_go_japon_0.js"></script>
<script src="data/okinawaj_go_japon_0.js"></script>

<script>

// ✅ Détection mobile
var isMobile = window.innerWidth <= 768;

// Carte principale
var mapMain = L.map('map-main', {
    zoomControl: false,
    maxZoom: isMobile ? 7 : 5.4,
    minZoom: isMobile ? 4 : 5.4,
    dragging: false,             // ✅ swipe
    scrollWheelZoom: false,
    doublekZoom: isMobile,
    boxZoom: false,
    keyboard: false,
    touchZoom: isMobile             // ✅ pinch zoom
}).setView([38.4000, 137.7500], isMobile ? 4.6 : 5.2);

function highlightFeature(e) {
    var layer = e.target;
    if (layer.feature.properties.propose === 1) {
        layer.setStyle({
            weight: 3,
            color: '#E60B0B',
            fillColor: '#E60B0B',
            fillOpacity: 0.7
        });
        layer.bringToFront();
    }
}

function pop_j_go_japon_0(feature, layer) {
    if (feature.properties.propose === 1) {
        layer.on({
            mouseover: function(e) {
                document.getElementById('hover-label').innerHTML = feature.properties.NAME_1;
                highlightFeature(e);
            },
            mouseout: function(e) {
                document.getElementById('hover-label').innerHTML = 'Découvrir';
                layer.setStyle(style_j_go_japon_0_0(feature));
            },
            click: function(e) {

    var prefectureUrls = {

        "Aomori": "https://www.jgojapon.fr/prefectures/aomori",
        "Chiba": "https://www.jgojapon.fr/prefectures/chiba",
        "Fukui": "https://www.jgojapon.fr/prefectures/fukui",
        "Fukuoka": "https://www.jgojapon.fr/prefectures/fukuoka",
        "Gifu": "https://www.jgojapon.fr/prefectures/gifu",
        "Gunma": "https://www.jgojapon.fr/prefectures/gunma",
        "Hiroshima": "https://www.jgojapon.fr/prefectures/hiroshima",
        "Hokkaido": "https://www.jgojapon.fr/prefectures/hokkaido",
        "Hyogo": "https://www.jgojapon.fr/prefectures/hyogo",
        "Ishikawa": "https://www.jgojapon.fr/prefectures/ishikawa",
        "Kagoshima": "https://www.jgojapon.fr/prefectures/kagoshima",
        "Kanagawa": "https://www.jgojapon.fr/prefectures/kanagawa",
        "Kumamoto": "https://www.jgojapon.fr/prefectures/kumamoto",
        "Kyoto": "https://www.jgojapon.fr/prefectures/kyoto",
        "Mie": "https://www.jgojapon.fr/prefectures/mie",
        "Miyazaki": "https://www.jgojapon.fr/prefectures/miyazaki",
        "Nagano": "https://www.jgojapon.fr/prefectures/nagano",
        "Nara": "https://www.jgojapon.fr/prefectures/nara",
        "Niigata": "https://www.jgojapon.fr/prefectures/niigata",
        "Okinawa": "https://www.jgojapon.fr/prefectures/okinawa",
        "Osaka": "https://www.jgojapon.fr/prefectures/osaka",
        "Shiga": "https://www.jgojapon.fr/prefectures/shiga",
        "Tochigi": "https://www.jgojapon.fr/prefectures/tochigi",
        "Tokyo": "https://www.jgojapon.fr/prefectures/tokyo",
        "Wakayama": "https://www.jgojapon.fr/prefectures/wakayama",
        "Yamagata": "https://www.jgojapon.fr/prefectures/yamagata",
        "Yamanashi": "https://www.jgojapon.fr/prefectures/yamanashi"

    };

    var url = prefectureUrls[feature.properties.NAME_1];

    if (url) {
        window.open(url, '_blank');
    }

}
        });
    }
}

function style_j_go_japon_0_0(feature) {
    switch(String(feature.properties['propose'])) {
        case '0':
            return { color:'rgba(52,52,52,1.0)', weight:1, fill:true, fillOpacity:1, fillColor:'rgba(0,0,0,1.0)', interactive:false };
        case '1':
            return { color:'rgba(52,52,52,1.0)', weight:1, fill:true, fillOpacity:1, fillColor:'#e6b727', interactive:true };
        default:
            return { color:'rgba(52,52,52,1.0)', weight:1, fill:true, fillOpacity:1, fillColor:'rgba(207,84,125,1.0)', interactive:false };
    }
}

var layer_j_go_japon_0 = new L.geoJson(json_j_go_japon_0, {
    onEachFeature: pop_j_go_japon_0,
    style: style_j_go_japon_0_0
}).addTo(mapMain);

// Okinawa
var mapOkinawa = L.map('map-okinawa', {
    attributionControl: false,
    zoomControl: false,
    maxZoom: 6.5,
    minZoom: 6.5,
    dragging: false,
    touchZoom: isMobile
}).setView([26.46, 127.8], 6.5);

var layer_okinawaj_go_japon_0 = new L.geoJson(json_okinawaj_go_japon_0, {
    style: () => ({ color:'rgba(52,52,52,1.0)', weight:1, fill:true, fillOpacity:1, fillColor:'#e6b727', interactive:true }),
    onEachFeature: function(feature, layer) {
        layer.on({
            mouseover: function(e) {
                document.getElementById('hover-label').innerHTML = feature.properties.NAME_1;
                highlightFeature(e);
            },
            mouseout: function() {
                document.getElementById('hover-label').innerHTML = 'Découvrir';
            },
            click: function() {
                window.open('https://www.jgojapon.fr/prefectures/okinawa', '_blank');
            }
        });
    }
}).addTo(mapOkinawa);

</script>

</body>
</html>
